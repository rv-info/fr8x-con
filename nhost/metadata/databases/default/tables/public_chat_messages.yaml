table:
  name: chat_messages
  schema: public
object_relationships:
  - name: conversation
    using:
      foreign_key_constraint_on: conversation_id
insert_permissions:
  - role: user
    permission:
      set:
        sender_id: x-hasura-User-Id
      check:
        _and:
          - recipient_id:
              _neq: X-Hasura-User-Id
          - conversation:
              members:
                user_id:
                  _eq: X-Hasura-User-Id
          - _exists:
              _table:
                schema: public
                name: chat_conversation_members
              _where:
                _and:
                  - conversation_id:
                      _ceq:
                        - $
                        - conversation_id
                  - user_id:
                      _ceq:
                        - $
                        - recipient_id
      columns:
        - conversation_id
        - recipient_id
        - client_message_id
        - content
        - message_type
        - attachments
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - conversation_id
        - sender_id
        - recipient_id
        - client_message_id
        - content
        - message_type
        - attachments
        - created_at
        - read_at
        - edited_at
        - deleted_at
      filter:
        conversation:
          members:
            user_id:
              _eq: X-Hasura-User-Id
update_permissions:
  - role: user
    permission:
      columns:
        - read_at
      filter:
        recipient_id:
          _eq: X-Hasura-User-Id
      check:
        recipient_id:
          _eq: X-Hasura-User-Id
