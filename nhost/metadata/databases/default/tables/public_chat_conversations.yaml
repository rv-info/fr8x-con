table:
  name: chat_conversations
  schema: public
array_relationships:
  - name: members
    using:
      foreign_key_constraint_on:
        column: conversation_id
        table:
          name: chat_conversation_members
          schema: public
  - name: messages
    using:
      foreign_key_constraint_on:
        column: conversation_id
        table:
          name: chat_messages
          schema: public
insert_permissions:
  - role: user
    permission:
      check: {}
      columns:
        - direct_key
        - context_type
        - context_id
        - context_title
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - direct_key
        - context_type
        - context_id
        - context_title
        - created_at
        - updated_at
      filter:
        members:
          user_id:
            _eq: X-Hasura-User-Id
update_permissions:
  - role: user
    permission:
      columns:
        - context_type
        - context_id
        - context_title
      filter:
        members:
          user_id:
            _eq: X-Hasura-User-Id
      check: {}
