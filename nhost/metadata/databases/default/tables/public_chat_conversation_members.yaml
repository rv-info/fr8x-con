table: 
  name: chat_conversation_members
  schema: public
object_relationships: 
  - name: chat_conversation
    using: 
      foreign_key_constraint_on: conversation_id
insert_permissions: 
  - role: user
    permission: 
      check: 
        _or: 
          - user_id: 
              _eq: X-Hasura-User-Id
          - chat_conversation: 
              chat_conversation_members: 
                user_id: 
                  _eq: X-Hasura-User-Id
          - _not: 
              chat_conversation: 
                chat_conversation_members: {}
      columns: 
        - conversation_id
        - user_id
        - last_read_at
select_permissions: 
  - role: user
    permission: 
      columns: 
        - conversation_id
        - user_id
        - joined_at
        - last_read_at
      filter: 
        chat_conversation: 
          chat_conversation_members: 
            user_id: 
              _eq: X-Hasura-User-Id
update_permissions: 
  - role: user
    permission: 
      columns: 
        - last_read_at
      filter: 
        user_id: 
          _eq: X-Hasura-User-Id
      check: {}
