# k8s/secrets.yaml
# ⚠️  TEMPLATE ONLY — Do NOT commit real values to git
# Fill in base64-encoded values and apply with:
#   kubectl apply -f k8s/secrets.yaml
#
# Encode a value: echo -n "your_value" | base64

apiVersion: v1
kind: Namespace
metadata:
  name: fr8x
---
apiVersion: v1
kind: Secret
metadata:
  name: fr8x-secrets
  namespace: fr8x
  labels:
    app: fr8x
type: Opaque
data:
  # Redis password (base64 encoded)
  # echo -n "your_redis_password" | base64
  REDIS_PASSWORD: <BASE64_REDIS_PASSWORD>

  # Full Redis URL for the app — includes password
  # echo -n "redis://:your_redis_password@fr8x-redis-service:6379" | base64
  REDIS_URL: <BASE64_REDIS_URL>

  # 64-byte random session secret for Godfather
  # echo -n "$(openssl rand -hex 64)" | base64
  GODFATHER_SESSION_SECRET: <BASE64_SESSION_SECRET>

  # 32-byte hex AES-256 key for field encryption
  # echo -n "$(openssl rand -hex 32)" | base64
  GODFATHER_KMS_ENCRYPTION_KEY: <BASE64_KMS_KEY>

  # Zoho SMTP App Password
  ZOHO_SMTP_PASSWORD: <BASE64_ZOHO_PASSWORD>

  # Firebase Admin SDK credentials
  FIREBASE_ADMIN_PROJECT_ID: <BASE64_FIREBASE_PROJECT_ID>
  FIREBASE_ADMIN_CLIENT_EMAIL: <BASE64_FIREBASE_CLIENT_EMAIL>
  FIREBASE_ADMIN_PRIVATE_KEY: <BASE64_FIREBASE_PRIVATE_KEY>
