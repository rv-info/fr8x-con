# k8s/redis.yaml
# Redis Deployment + ClusterIP Service for OTP and session cache

apiVersion: apps/v1
kind: Deployment
metadata:
  name: fr8x-redis
  namespace: fr8x
  labels:
    app: fr8x-redis
    tier: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fr8x-redis
  template:
    metadata:
      labels:
        app: fr8x-redis
        tier: cache
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command:
            - redis-server
            - "--requirepass"
            - "$(REDIS_PASSWORD)"
            - "--maxmemory"
            - "128mb"
            - "--maxmemory-policy"
            - "allkeys-lru"
            - "--save"
            - ""
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fr8x-secrets
                  key: REDIS_PASSWORD
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: fr8x-redis-service
  namespace: fr8x
  labels:
    app: fr8x-redis
spec:
  type: ClusterIP
  selector:
    app: fr8x-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
