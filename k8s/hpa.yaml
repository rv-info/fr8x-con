# k8s/hpa.yaml
# Horizontal Pod Autoscaler — scales fr8x-app pods based on CPU load

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fr8x-app-hpa
  namespace: fr8x
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fr8x-app
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
