name: FR8X Production CI Quality Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    name: TypeCheck, Lint & Build Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --prefer-offline

      - name: TypeScript Type Check
        run: npm run type-check

      - name: Next.js ESLint Verification
        run: npm run lint

      - name: Architectural Quality Gates (Phase 7-11 Verification Suites)
        run: npm test

      - name: Next.js Production Build
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY || 'mock-api-key-for-ci-build' }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID || 'fr8x-con' }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN || 'fr8x-con.firebaseapp.com' }}

      - name: Repository Secret Leak Prevention
        run: |
          echo "Verifying no local secrets or .env.local files are committed..."
          if git ls-files | grep -E '\.env\.local$'; then
            echo "ERROR: .env.local found in repository tracking!"
            exit 1
          fi
          echo "Secret leak check passed."
