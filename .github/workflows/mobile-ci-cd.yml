name: Mobile Automation — OTA Updates & Android Build

on:
  push:
    branches: [ main, master ]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci-cd.yml'

jobs:
  mobile-ota-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'mobile/package-lock.json'

      - name: 🚀 Setup Expo & EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install Mobile Dependencies
        run: |
          cd mobile
          npm ci

      - name: 📱 Build Expo Application Bundle
        run: |
          cd mobile
          npx expo export

      - name: 📲 Publish Over-The-Air (OTA) Update
        if: ${{ secrets.EXPO_TOKEN != '' }}
        continue-on-error: true
        run: |
          cd mobile
          eas update --auto --non-interactive
