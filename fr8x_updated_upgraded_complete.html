<!doctype html>
<!--
FR8X v1 — MASTER PRODUCTION UPGRADE (STANDALONE ARCHITECTURE)
Fully responsive, modular B2B Freight Forwarding Workspace
Includes:
- Multi-Window Trade Chat Dock (Multiple concurrent windows, Minimize/Restore/Close, No attachments)
- Universal Feed Search (Top-right, 7 initial matches + MORE expansion, Newest first)
- 3-Tier Threaded Commenting (Post -> Comment -> Reply -> Reply-to-Reply)
- 3-Card Single Row Desktop Credentials (Experience, Education, Certifications with Add/Edit/Remove)
- Dynamic Red-Outlined Local Time Box (Real-time clock calculated from owner timezone)
- Live Currency Valuation & Conversion Tool (CR/INR to USD/EUR/AED/SGD/CNY + Reverse)
- Reverse Auctions Dashboard (Bid Posted, Bid Participated, Multi-Container ADD ROW, Immutable Snapshots)
- UID-Based Permission Model & Strict Corporate Email Validation
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FR8X | Global Freight Workspace</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap');
    :root {
      --font: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --bg: #f4f7fb;
      --card: #ffffff;
      --ink: #17243a;
      --ink-sec: #394b61;
      --mut: #68788f;
      --faint: #8da0b8;
      --line: #dce5ef;
      --line-light: #edf2f8;
      --brand: #1168d7;
      --brand2: #0d53ad;
      --teal: #099889;
      --nav: #0d1d31;
      --navhi: #17304b;
      --green: #16834e;
      --amber: #a85b05;
      --red: #c43b4e;
      --gold: #d97706;
      --r: 10px;
      --sh: 0 2px 12px rgba(24, 54, 89, 0.08);
      --sh-md: 0 4px 20px rgba(24, 54, 89, 0.12);
      --sh-lg: 0 16px 42px rgba(12, 31, 59, 0.22);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 13px; -webkit-font-smoothing: antialiased; }
    body { background: var(--bg); font: 1rem/1.45 var(--font); color: var(--ink); min-height: 100vh; overflow-x: hidden; }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; border: none; background: none; }
    a { color: inherit; text-decoration: none; }
    svg.lucide { width: 16px; height: 16px; flex: none; vertical-align: middle; stroke-width: 1.9; }

    /* Layout */
    .app { min-height: 100vh; display: grid; grid-template-columns: 230px 1fr; transition: grid-template-columns 0.2s ease; }
    .app.collapsed { grid-template-columns: 68px 1fr; }
    .side { background: var(--nav); color: #b9c7d8; height: 100vh; position: sticky; top: 0; padding: 16px 10px; display: flex; flex-direction: column; overflow-y: auto; overflow-x: hidden; z-index: 40; border-right: 1px solid rgba(0,0,0,0.15); }
    .brand { display: flex; align-items: center; gap: 8px; color: #fff; font-weight: 700; font-size: 20px; padding: 0 8px 18px; }
    .mark { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: linear-gradient(135deg, #1478df, #099889); font-size: 10px; font-weight: 800; color: #fff; }
    .brand b { color: #2dd4bf; }
    .workspace { background: #18314d; border: 1px solid rgba(255,255,255,0.09); border-radius: 8px; margin: 0 2px 14px; padding: 9px 10px; }
    .workspace small { display: block; font-size: 9px; letter-spacing: .08em; color: #8ba1b9; text-transform: uppercase; font-weight: 700; }
    .workspace strong { font-size: 11.5px; color: #fff; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .navlabel { color: #6c8099; font-size: 9px; text-transform: uppercase; letter-spacing: .1em; padding: 8px 12px 4px; font-weight: 700; }
    .nav { display: flex; flex-direction: column; gap: 3px; }
    .nav button { display: flex; align-items: center; gap: 10px; width: 100%; height: 36px; border-radius: 6px; padding: 0 11px; color: #b9c7d8; text-align: left; font-weight: 600; }
    .nav button:hover, .nav button.on { background: var(--navhi); color: #fff; }
    .nav button.on { border-left: 3px solid #2dd4bf; }
    .nav em { margin-left: auto; font-style: normal; font-size: 9.5px; border-radius: 10px; padding: 1px 6px; background: #265271; color: #9ceadd; }
    .sidefoot { margin-top: auto; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 12px; }
    .user { display: flex; align-items: center; gap: 8px; padding: 0 4px 8px; }
    .avatar { width: 30px; height: 30px; border-radius: 8px; color: #fff; display: grid; place-items: center; background: linear-gradient(135deg, #1478df, #099889); font-weight: 700; font-size: 11px; flex-shrink: 0; }
    .avatar.big { width: 44px; height: 44px; font-size: 14px; }
    .sidelink { display: flex; gap: 8px; align-items: center; color: #8fa3bb; width: 100%; padding: 6px 8px; font-size: 11px; border-radius: 6px; }
    .sidelink:hover { background: var(--navhi); color: #fff; }

    /* TopBar */
    .top { height: 56px; background: #fff; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 16px; padding: 0 20px; }
    .crumb { color: var(--mut); font-size: 12px; }
    .crumb b { color: var(--ink); }
    .topright { margin-left: auto; display: flex; gap: 12px; align-items: center; font-size: 11px; }
    .country { display: flex; gap: 4px; align-items: center; color: var(--ink); font-weight: 600; }
    .country b { color: var(--brand); }
    .currency-select { background: #e8f8f5; color: #087b70; padding: 4px 10px; border-radius: 6px; font-weight: 700; display: flex; align-items: center; gap: 5px; border: 1px solid #bcece4; }
    .topicon { width: 32px; height: 32px; border: 1px solid var(--line); background: #fff; border-radius: 7px; display: grid; place-items: center; position: relative; }
    .topicon:hover { background: #f8fafc; }
    .dot { position: absolute; width: 7px; height: 7px; background: var(--red); border: 1.5px solid #fff; border-radius: 50%; right: 5px; top: 5px; }

    /* Views */
    .view { padding: 20px 24px 100px; width: 100%; }
    .head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
    .head h1 { margin: 0; font-size: 20px; font-weight: 700; color: var(--ink); }
    .head p { margin: 3px 0 0; font-size: 12px; color: var(--mut); }
    .btn { border: 1px solid transparent; border-radius: 7px; background: #fff; height: 32px; padding: 0 12px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 12px; font-weight: 600; }
    .btn.primary { background: var(--brand); color: #fff; }
    .btn.primary:hover { background: var(--brand2); }
    .btn.secondary { border-color: var(--line); color: var(--ink-sec); }
    .btn.secondary:hover { background: #f8fafc; }
    .btn.danger { background: #fef2f2; color: var(--red); border-color: #fecaca; }
    .btn.sm { height: 26px; padding: 0 8px; font-size: 11px; }

    /* Cards & Components */
    .card { background: #fff; border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--sh); overflow: hidden; }
    .cardhead { padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); font-size: 12.5px; font-weight: 700; }
    .cardbody { padding: 14px; }
    .badge { display: inline-flex; align-items: center; gap: 3px; padding: 2px 7px; border-radius: 10px; font-size: 10px; font-weight: 700; }
    .badge.blue { background: #e8f1fd; color: var(--brand); }
    .badge.green { background: #e7f7ed; color: var(--green); }
    .badge.amber { background: #fdf3e3; color: var(--amber); }
    .badge.red { background: #fff0f1; color: var(--red); }
    .badge.gray { background: #eef2f7; color: var(--mut); }
    .gold-star { color: #d97706; font-size: 11px; }

    /* Red Outlined Local Time Box */
    .red-outlined-time-box { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; border: 1.5px solid #dc2626; border-radius: 8px; padding: 4px 10px; background: #fef2f2; }
    .red-outlined-time-box .time-label { font-size: 8px; font-weight: 800; color: #dc2626; text-transform: uppercase; }
    .red-outlined-time-box .time-value { font-size: 12.5px; font-weight: 800; color: #991b1b; font-family: var(--font-mono); }

    /* Multi-Window Chat Dock Tray */
    .multichattray { position: fixed; bottom: 0; right: 76px; display: flex; align-items: flex-end; gap: 10px; z-index: 55; }
    .singlechatwindow { width: 285px; height: 375px; background: #fff; border: 1px solid var(--line); border-bottom: none; border-radius: 10px 10px 0 0; box-shadow: var(--sh-md); display: flex; flex-direction: column; overflow: hidden; }
    .singlechatwindow.minimized { height: 36px; cursor: pointer; }
    .chathead { display: flex; align-items: center; gap: 8px; background: var(--nav); color: #fff; padding: 9px 11px; }
    .chathead b { font-size: 11.5px; display: flex; align-items: center; gap: 4px; }
    .chathead small { font-size: 9.5px; color: #a5bad2; }
    .chathead .ha { margin-left: auto; display: flex; gap: 2px; }
    .chathead button { width: 22px; height: 22px; display: grid; place-items: center; color: #c7d6e8; border-radius: 4px; }
    .chathead button:hover { background: rgba(255,255,255,0.15); color: #fff; }
    .chatbody { flex: 1; overflow-y: auto; background: #f8fafc; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
    .msg { max-width: 84%; padding: 6px 9px; border-radius: 8px 8px 8px 2px; font-size: 11.5px; background: #fff; border: 1px solid var(--line); align-self: flex-start; }
    .msg.me { background: #e8f1fd; border-color: #c6dcf8; border-radius: 8px 8px 2px 8px; align-self: flex-end; }
    .msg small { display: block; font-size: 9px; color: var(--faint); text-align: right; margin-top: 2px; }
    .compose { padding: 6px 8px; display: flex; gap: 6px; border-top: 1px solid var(--line); background: #fff; }
    .compose textarea { flex: 1; height: 32px; resize: none; border: 1px solid var(--line); border-radius: 6px; padding: 6px; font-size: 11px; }
    .compose button { width: 32px; height: 32px; background: var(--brand); color: #fff; border-radius: 6px; display: grid; place-items: center; }

    .chatfab { position: fixed; right: 18px; bottom: 18px; width: 48px; height: 48px; border-radius: 50%; background: var(--brand); color: #fff; display: grid; place-items: center; box-shadow: var(--sh-md); z-index: 55; }
    .chatfab .n { position: absolute; top: -2px; right: -2px; width: 18px; height: 18px; border-radius: 50%; background: var(--red); color: #fff; font-size: 9px; font-weight: 700; display: grid; place-items: center; border: 2px solid #fff; }

    /* Modals & Toasts */
    .modalbg { display: none; position: fixed; inset: 0; background: rgba(16,31,51,0.55); z-index: 100; padding: 20px; overflow-y: auto; place-items: center; }
    .modalbg.show { display: grid; }
    .modal { width: min(680px, 100%); background: #fff; border-radius: 12px; box-shadow: var(--sh-lg); overflow: hidden; display: flex; flex-direction: column; }
    .modalhead { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 700; }
    .modalbody { padding: 16px; max-height: 75vh; overflow-y: auto; }
    .modalfoot { padding: 10px 16px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; background: #fafbfd; }
    .toastbox { position: fixed; right: 18px; bottom: 76px; z-index: 150; display: flex; flex-direction: column; gap: 6px; }
    .toast { background: #142943; color: #fff; padding: 9px 13px; border-radius: 7px; font-size: 11.5px; box-shadow: var(--sh-md); }

    /* Grid Form Utilities */
    .grid { display: grid; gap: 10px; }
    .g2 { grid-template-columns: repeat(2, 1fr); }
    .g3 { grid-template-columns: repeat(3, 1fr); }
    .g4 { grid-template-columns: repeat(4, 1fr); }
    .field label { display: block; font-size: 10px; font-weight: 700; color: var(--mut); margin-bottom: 3px; text-transform: uppercase; }
    .input { width: 100%; height: 32px; border: 1px solid var(--line); border-radius: 6px; padding: 0 8px; font-size: 11.5px; background: #fff; }
    .input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 2px rgba(17,104,215,0.15); }
    textarea.input { height: auto; min-height: 64px; padding: 8px; }

    /* Responsive */
    @media (max-width: 1024px) {
      .app { grid-template-columns: 68px 1fr; }
      .g3, .g4 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div class="app" id="appRoot">
  <!-- Sidebar -->
  <aside class="side" id="sideNav">
    <div class="brand">
      <span class="mark">f8</span>
      <span class="brand-text">fr<b>8</b>x</span>
    </div>
    <div class="workspace">
      <small>Workspace</small>
      <strong id="sideWorkspace">Atlas Logistics Pvt. Ltd.</strong>
    </div>
    <div class="navlabel">Workspace</div>
    <nav class="nav">
      <button onclick="navigate('feeds')" id="nav-feeds" class="on"><i data-lucide="layout-dashboard"></i><span class="nav-text">Feeds</span></button>
      <button onclick="navigate('nexus')" id="nav-nexus"><i data-lucide="globe-2"></i><span class="nav-text">Nexus</span><em>12</em></button>
      <button onclick="navigate('auctions')" id="nav-auctions"><i data-lucide="gavel"></i><span class="nav-text">Auctions</span></button>
      <button onclick="navigate('rates')" id="nav-rates"><i data-lucide="chart-column"></i><span class="nav-text">Rates</span></button>
      <div class="navlabel">Account</div>
      <button onclick="navigate('profile')" id="nav-profile"><i data-lucide="circle-user-round"></i><span class="nav-text">Profile</span></button>
    </nav>
    <div class="sidefoot">
      <div class="user">
        <div class="avatar" id="sideAvatar">AR</div>
        <div class="user-info">
          <b id="sideUserName">Arjun Rao <span class="gold-star">★</span></b>
          <small id="sideUserRole">Freight Manager</small>
        </div>
      </div>
      <button class="sidelink" onclick="toggleSidebar()"><i data-lucide="panel-left-close"></i><span class="nav-text">Collapse sidebar</span></button>
      <button class="sidelink" onclick="toast('Signed out.')"><i data-lucide="log-out"></i><span class="nav-text">Sign out</span></button>
    </div>
  </aside>

  <!-- Main View -->
  <main>
    <header class="top">
      <div class="crumb">Workspace / <b id="topCrumb">Feeds</b></div>
      <div class="topright">
        <span class="country">
          <i data-lucide="map-pin" style="color:var(--brand);width:13px;height:13px"></i>
          LOCATION: <b id="topLocation">Mumbai, India</b>
        </span>
        <button class="currency-select" onclick="openCurrencyModal()">
          <i data-lucide="calculator" style="width:12px;height:12px"></i>
          <span id="topCurrBtn">CR · INR (₹)</span>
        </button>
        <button class="topicon" onclick="toast('You have 3 unread freight alerts.')">
          <i data-lucide="bell" style="width:14px;height:14px"></i>
          <span class="dot"></span>
        </button>
        <button onclick="switchCounterpartUser()" style="display:flex;align-items:center;gap:4px;font-weight:700">
          <span id="topUserDisplay">Arjun Rao</span> <span class="gold-star">★</span>
          <i data-lucide="chevron-down" style="width:12px;height:12px"></i>
        </button>
      </div>
    </header>
    <div class="view" id="mainView"></div>
  </main>
</div>

<!-- Multi-Window Chat Tray Dock -->
<div class="multichattray" id="chatTray"></div>
<button class="chatfab" onclick="openChatLauncher()"><i data-lucide="messages-square"></i><span class="n">2</span></button>

<!-- Modal & Toasts -->
<div class="modalbg" id="modalBg"><div class="modal"><div class="modalhead"><span id="modalTitle">Details</span><button onclick="closeModal()"><i data-lucide="x"></i></button></div><div class="modalbody" id="modalBody"></div><div class="modalfoot" id="modalFoot"></div></div></div>
<div class="toastbox" id="toasts"></div>

<script>
// Master Reactive Data Store
const DATA = {
  activeUser: {
    uid: 'u-arjun',
    name: 'Arjun Rao',
    role: 'Freight Manager',
    company: 'Atlas Logistics Pvt. Ltd.',
    city: 'Mumbai',
    country: 'India',
    timezone: 'Asia/Kolkata',
    plan: 'premium',
    hasGoldenTick: true,
    email: 'arjun@atlaslogistics.com'
  },

  ratesUSD: { USD: 1, INR: 87.5, EUR: 0.92, GBP: 0.78, AED: 3.67, SGD: 1.34, CNY: 7.24 },
  symbols: { USD: '$', INR: '₹', EUR: '€', GBP: '£', AED: 'AED ', SGD: 'S$', CNY: '¥' },

  minimizedChats: [],

  },

      { me: false, text: 'Hi Arjun, can you share the updated 40HC rate for the Rotterdam auto parts shipment?', time: '09:12' },
      { me: true, text: 'Sure Sarah — all-in rate is USD 2,320 with 14 days combined free time.', time: '09:15' }
    ],
    kiran: [
      { me: false, text: 'Please confirm cargo-ready date for the Antwerp consignment.', time: 'Yesterday' }
    ]
  },
  posts: [
    {
      id: 'p1',
      author: 'Priya Nair',
      authorUid: 'u-priya',
      role: 'Trade Specialist · Mumbai',
      time: '1h ago',
      text: '*Blank sailings* have tightened capacity on Asia-Europe lanes through mid-September. Booking 10-14 days ahead is strongly advised.',
      likes: 24,
      dis: 0,
      saved: false,
      comments: [
        {
          id: 'c1',
          author: 'Kiran Mehta',
          text: 'Seeing the same trend on our contracts — thanks for flagging.',
          time: '45m ago',
          replies: [
            { id: 'r1', author: 'Priya Nair', text: 'Happy to share our verified forwarder carrier notes directly.', time: '20m ago' }
          ]
        }
      ]
    },
    {
      id: 'p2',
      author: 'Arjun Rao',
      authorUid: 'u-arjun',
      role: 'Freight Manager · Mumbai',
      time: '3h ago',
      text: 'Reverse auction published for *Mumbai → Rotterdam (FCL Export)*. 12x 40HC containers cargo-ready by 05 Sep. Verified forwarders can review requirements in the Auction Dashboard.',
      likes: 18,
      dis: 0,
      saved: true,
      comments: []
    }
  ],
  experiences: [
    { id: 'e1', title: 'Freight Manager', company: 'Atlas Logistics Pvt. Ltd.', type: 'Full-time', time: 'Jan 2021 – Present', location: 'Mumbai, India', desc: 'Heading ocean procurement, liner contract execution, and reverse auctions.' }
  ],
  educations: [
    { id: 'ed1', qual: 'MBA in Logistics & Supply Chain', inst: 'Symbiosis Institute of Business', time: '2016 – 2018', grade: 'Distinction' }
  ],
  certifications: [
    { id: 'ce1', title: 'IATA Dangerous Goods Regulation (DGR)', org: 'IATA Training Center', time: 'Mar 2024 – Mar 2027', idNum: 'DGR-2024-8849' }
  ]
};

// Utilities
const icons = () => window.lucide && lucide.createIcons();
const toast = (msg) => {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => el.remove(), 2600);
};

const modal = (title, body, foot = '') => {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = body;
  document.getElementById('modalFoot').innerHTML = foot;
  document.getElementById('modalBg').classList.add('show');
  icons();
};
const closeModal = () => document.getElementById('modalBg').classList.remove('show');

function getLiveLocalTime(tz = 'Asia/Kolkata') {
  try {
    return new Intl.DateTimeFormat('en-US', { timeZone: tz, hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true }).format(new Date());
  } catch {
    return new Date().toLocaleTimeString();
  }
}

// Navigation Router
function navigate(page) {
  document.querySelectorAll('.nav button').forEach(b => b.classList.remove('on'));
  const targetBtn = document.getElementById('nav-' + page);
  if (targetBtn) targetBtn.classList.add('on');
  document.getElementById('topCrumb').textContent = page.charAt(0).toUpperCase() + page.slice(1);

  const container = document.getElementById('mainView');
  if (page === 'feeds') renderFeedsView(container);
  else if (page === 'auctions') renderAuctionsView(container);
  else if (page === 'profile') renderProfileView(container);
  else if (page === 'nexus') renderNexusView(container);
  else if (page === 'rates') renderRatesView(container);
  icons();
}

function toggleSidebar() {
  document.getElementById('appRoot').classList.toggle('collapsed');
}

function openProfileModal(name) {
  const isSarah = name.includes('Sarah');
  const tz = isSarah ? 'Europe/Amsterdam' : 'Asia/Kolkata';
  const time = getLiveLocalTime(tz);
  modal(name + ' — Member Profile', `
    <div style="display:flex;gap:14px;align-items:flex-start;margin-bottom:14px;flex-wrap:wrap">
      <div class="avatar big">${name.split(' ').map(n=>n[0]).join('')}</div>
      <div style="flex:1">
        <h3 style="margin:0">${name} ${isSarah ? '' : '<span class="gold-star">★</span>'}</h3>
        <p style="color:var(--mut);font-size:12px;margin:2px 0">${isSarah ? 'Ocean Freight Lead · Rotterdam Freight NV' : 'Freight Manager · Atlas Logistics'}</p>
        <span class="badge green">Verified Member</span>
      </div>
      <div class="red-outlined-time-box">
        <small class="time-label">LOCAL TIME</small>
        <strong class="time-value">${time}</strong>
      </div>
    </div>
    <p style="font-size:12px;color:var(--ink-sec)">Verified freight professional managing container tenders, carrier negotiations, and trade lane operations.</p>
  `, `<button class="btn secondary" onclick="closeModal()">Close</button><button class="btn primary" onclick="closeModal();openChat('${isSarah?'sarah':'kiran'}')">Start Trade Chat</button>`);
}

// 1. Feeds View
function renderFeedsView(container) {
  container.innerHTML = `
    <div class="head">
      <div>

function submitPost() {
  const t = document.getElementById('newPostText').value.trim();
  if (!t) return toast('Please enter an update.');
  DATA.posts.unshift({
    id: 'p-' + Date.now(),
    author: DATA.activeUser.name,
    authorUid: DATA.activeUser.uid,
    role: DATA.activeUser.role + ' · Mumbai',
    time: 'Just now',
    text: t,
    likes: 0,
    dis: 0,
    saved: false,
    comments: []
  });
  navigate('feeds');
  toast('Update posted to feed.');
}

// Multi-Window Chat System
function renderChatTray() {
  const tray = document.getElementById('chatTray');
  tray.innerHTML = DATA.activeChats.map(contactId => {
    const contact = DATA.contacts[contactId] || { name: contactId, role: 'Counterpart', company: 'Freight Logistics' };
    const msgs = DATA.messages[contactId] || [];
    const isMin = DATA.minimizedChats.includes(contactId);

    if (isMin) {
      return `
        <div class="card" style="height:36px;padding:0 10px;display:flex;align-items:center;gap:6px;cursor:pointer;border-bottom:none" onclick="toggleMinimize('${contactId}')">
          <div class="avatar" style="width:20px;height:20px;font-size:9px">${contact.name.split(' ').map(n=>n[0]).join('')}</div>
          <b style="font-size:11px">${contact.name}</b>
          <button onclick="event.stopPropagation();closeChat('${contactId}')" style="margin-left:4px"><i data-lucide="x" style="width:12px;height:12px"></i></button>
        </div>
      `;
    }

    return `
      <div class="singlechatwindow">
        <div class="chathead">
          <div class="avatar" style="width:22px;height:22px;font-size:9px">${contact.name.split(' ').map(n=>n[0]).join('')}</div>
          <div>
            <b>${contact.name}</b>
            <small>${contact.company}</small>
          </div>
          <div class="ha">
            <button onclick="toggleMinimize('${contactId}')"><i data-lucide="minus" style="width:12px;height:12px"></i></button>
            <button onclick="closeChat('${contactId}')"><i data-lucide="x" style="width:12px;height:12px"></i></button>
          </div>
        </div>
        <div class="chatbody" id="chat-body-${contactId}">
          ${msgs.map(m => `
            <div class="msg ${m.me ? 'me' : ''}">
              <div>${m.text}</div>
              <small>${m.time}</small>
            </div>
          `).join('')}
        </div>
        <div class="compose">
          <textarea id="chat-input-${contactId}" placeholder="Trade message…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg('${contactId}')}"></textarea>
          <button onclick="sendMsg('${contactId}')"><i data-lucide="send" style="width:12px;height:12px"></i></button>
        </div>
      </div>
    `;
  }).join('');
  icons();
}

function openChat(id) {
  if (!DATA.activeChats.includes(id)) {
    if (DATA.activeChats.length >= 3) DATA.activeChats.shift();
    DATA.activeChats.push(id);
  }
  DATA.minimizedChats = DATA.minimizedChats.filter(x => x !== id);
  renderChatTray();
}

function closeChat(id) {
  DATA.activeChats = DATA.activeChats.filter(x => x !== id);
  renderChatTray();
}

function toggleMinimize(id) {
  if (DATA.minimizedChats.includes(id)) {
    DATA.minimizedChats = DATA.minimizedChats.filter(x => x !== id);
  } else {
    DATA.minimizedChats.push(id);
  }
  renderChatTray();
}

function sendMsg(id) {
  const input = document.getElementById('chat-input-' + id);
  if (!input || !input.value.trim()) return;
  if (!DATA.messages[id]) DATA.messages[id] = [];
  DATA.messages[id].push({
    me: true,
    text: input.value.trim(),
    time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
  });
  input.value = '';
  renderChatTray();
}
